# ═══════════════ TMUX JADOO ═══════════════
set -g mouse on                          # ماوس روشن
set -g history-limit 99999               # تاریخچه بی‌نهایت
set -g status-style bg=#1e1e2e,fg=#89b4fa # رنگ نوار (Catppuccin)
set -g pane-border-style fg=#313244
set -g pane-active-border-style fg=#89b4fa

# کلیدها (مثل VSCode)
unbind C-b
set -g prefix C-a                    # Ctrl+Space = پیشوند
bind C-a send-prefix

# پنجره و پنل
bind c new-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"
bind '"' split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# زوم و کپی
bind -n M-F11 resize-pane -Z            # Alt+F11 = زوم
set -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -in -selection clipboard"

# پلاگین‌های جادویی
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'   # Ctrl+b Ctrl+s = ذخیره
set -g @plugin 'tmux-plugins/tmux-continuum'  # خودکار ذخیره
set -g @plugin 'tmux-plugins/tmux-yank'        # y = کپی به کلیپ‌بورد
set -g @continuum-restore 'on'                 # بوت = ری‌استور خودکار

# کلیدهای یک‌حرفی
bind C new-session -c ~ \; rename-session 🏠
bind D new-session -c ~/Downloads \; rename-session 📥
bind P new-session -c ~/projects \; rename-session 💻

run '~/.tmux/plugins/tpm/tpm'
# ═══════════════ END TMUX ═══════════════
